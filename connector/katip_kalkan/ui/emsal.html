<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Katip emsal sonuçları</title>
<!--
  Katip feedback block + judge button (MCP App view for emsal_ara).
  Spec: /mnt/project-files/feedback-block/SPEC.md. The same block is meant for the web and iOS apps.
  Runs in the host's sandboxed iframe: no network (connect-src 'none'), talks to the host by postMessage only.
  Opened as a plain file, it shows sample data so designers can try every state.
-->
<style>
:root {
  --bg: var(--color-background-primary, #ffffff);
  --bg2: var(--color-background-secondary, #f5f5f2);
  --ink: var(--color-text-primary, #16191d);
  --quiet: var(--color-text-secondary, #5d636b);
  --line: var(--color-border-primary, #dcdcd6);
  --font: var(--font-sans, Inter, system-ui, -apple-system, "Segoe UI", sans-serif);
  --lime: #D4FF3A;           /* Katip brand accent */
  --tile: #1F242B;           /* Katip split-flap tile */
  --v0: #b42318; --v1: #b54708; --v2: #2f6f1f;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: var(--color-background-primary, #0f1215); --bg2: var(--color-background-secondary, #171b20);
          --ink: var(--color-text-primary, #eceee9); --quiet: var(--color-text-secondary, #9aa1a9);
          --line: var(--color-border-primary, #2a3038); --v0: #f97066; --v1: #fdb022; --v2: #a6e36b; --tile: #2c333c; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); }
.wrap { padding: 4px 2px 8px; }
.head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 0 2px 10px; }
.head h1 { font-size: 15px; font-weight: 600; margin: 0; }
.head p { margin: 0; color: var(--quiet); font-size: 12.5px; }

/* --- the block: one result, collapsed by default --- */
.block { border: 1px solid var(--line); border-radius: 10px; background: var(--bg); margin-bottom: 8px; overflow: hidden; }
.block[data-verdict="0"] { border-left: 4px solid var(--v0); }
.block[data-verdict="1"] { border-left: 4px solid var(--v1); }
.block[data-verdict="2"] { border-left: 4px solid var(--v2); }
.row { all: unset; box-sizing: border-box; width: 100%; display: grid; grid-template-columns: 22px 1fr auto; gap: 10px;
       align-items: center; padding: 10px 12px; cursor: pointer; }
.row:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; border-radius: 10px; }
.rank { font-variant-numeric: tabular-nums; color: var(--quiet); font-size: 12.5px; text-align: right; }
.title { font-weight: 600; font-size: 13.5px; }
.meta { color: var(--quiet); font-size: 12px; display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.chip { border: 1px solid var(--line); border-radius: 99px; padding: 0 7px; font-size: 11.5px; }

/* indicator = the verdict at a glance; empty ring until judged */
.ind { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--quiet); white-space: nowrap; }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 2px dashed var(--line); transition: all .25s; }
.block[data-verdict="0"] .dot { border: 0; background: var(--v0); }
.block[data-verdict="1"] .dot { border: 0; background: var(--v1); }
.block[data-verdict="2"] .dot { border: 0; background: var(--v2); }
.chev { width: 10px; height: 10px; border-right: 2px solid var(--quiet); border-bottom: 2px solid var(--quiet);
        transform: rotate(45deg); transition: transform .2s; margin-left: 4px; }
.block.open .chev { transform: rotate(-135deg); }

/* --- expanded context: what Katip found --- */
.body { display: none; padding: 0 12px 12px 44px; }
.block.open .body { display: block; }
.label { font-size: 11.5px; color: var(--quiet); text-transform: uppercase; letter-spacing: .04em; margin: 2px 0 4px; }
blockquote { margin: 0 0 8px; padding: 8px 10px; background: var(--bg2); border-radius: 8px; font-size: 13px; }
.why { font-size: 12.5px; color: var(--quiet); margin-bottom: 10px; }
.why a { color: var(--ink); }

/* --- judge: gavel button + three verdicts --- */
.judge { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.gavel { all: unset; box-sizing: border-box; display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px 0 8px;
         border-radius: 99px; background: var(--tile); color: #fff; font-weight: 600; font-size: 13px; cursor: pointer;
         transition: transform .12s, background .2s; }
.gavel:hover { transform: translateY(-1px); }
.gavel:active { transform: translateY(1px); }
.gavel:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
.gavel svg { width: 26px; height: 26px; overflow: visible; }
.hammer { transform-box: view-box; transform-origin: 26px 16px; transform: rotate(20deg); transition: transform .2s ease-out; }
.judge[data-state="idle"] .gavel:hover .hammer { transform: rotate(28deg); }
.judge[data-state="striking"] .hammer { animation: strike .5s cubic-bezier(.5, 0, .9, .4) infinite alternate; }
.judge[data-state="done"] .hammer { transform: rotate(0deg); }
.ring { opacity: 0; transform-box: view-box; transform-origin: 8px 22px; }
.judge[data-state="done"] .ring { animation: impact .5s ease-out 1; }
.judge[data-state="done"] .gavel { background: var(--lime); color: var(--tile); }
.judge[data-state="error"] .gavel { animation: shake .35s; }
@keyframes strike { from { transform: rotate(28deg); } to { transform: rotate(-1deg); } }
@keyframes impact { 0% { opacity: .9; transform: scale(.4); } 100% { opacity: 0; transform: scale(1.8); } }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

.verdicts { display: none; gap: 6px; }
.judge[data-state="open"] .verdicts { display: inline-flex; animation: pop .18s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateX(-6px); } }
.v { all: unset; box-sizing: border-box; height: 32px; padding: 0 12px; border-radius: 99px; border: 1.5px solid var(--line);
     font-size: 12.5px; font-weight: 600; cursor: pointer; background: var(--bg); }
.v:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.v[data-v="0"]:hover { border-color: var(--v0); color: var(--v0); }
.v[data-v="1"]:hover { border-color: var(--v1); color: var(--v1); }
.v[data-v="2"]:hover { border-color: var(--v2); color: var(--v2); }
.status { font-size: 12px; color: var(--quiet); }
.judge[data-state="error"] .status { color: var(--v0); }
.foot { color: var(--quiet); font-size: 12px; margin: 6px 2px 0; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1 id="h">Katip'in bulduğu emsaller</h1><p id="sub"></p></div>
  <div id="list" role="list"></div>
  <p class="foot" id="foot"></p>
</div>
<template id="gavel-svg">
  <svg viewBox="0 0 28 28" aria-hidden="true">
    <circle class="ring" cx="8" cy="22" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <rect x="1" y="22" width="14" height="3.5" rx="1.5" fill="currentColor" opacity=".55"/>
    <g class="hammer">
      <rect x="11" y="14.5" width="15.5" height="3" rx="1.5" fill="currentColor"/>
      <rect x="4.5" y="8" width="7" height="14" rx="2" fill="currentColor"/>
      <rect x="3.5" y="9.5" width="9" height="2" rx="1" fill="currentColor"/>
      <rect x="3.5" y="18.5" width="9" height="2" rx="1" fill="currentColor"/>
    </g>
  </svg>
</template>
<script>
"use strict";
const VERDICTS = [
  { v: 0, label: "Alakasız", short: "Alakasız" },
  { v: 1, label: "İlgili", short: "İlgili" },
  { v: 2, label: "Atıf yaparım", short: "Atıf yaparım" },
];
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

/* ---- host bridge (MCP Apps, JSON-RPC over postMessage) ---- */
const embedded = window.parent !== window;
let nextId = 1;
const waiting = new Map();
function request(method, params) {
  const id = nextId++;
  window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
  return new Promise((resolve, reject) => {
    waiting.set(id, { resolve, reject });
    setTimeout(() => waiting.delete(id) && reject(new Error("timeout")), 20000);
  });
}
const notify = (method, params) => window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
window.addEventListener("message", e => {
  const m = e.data;
  if (!m || m.jsonrpc !== "2.0") return;
  if (m.id != null && waiting.has(m.id)) {
    const w = waiting.get(m.id); waiting.delete(m.id);
    m.error ? w.reject(new Error(m.error.message || "error")) : w.resolve(m.result);
  } else if (m.method === "ui/notifications/tool-result") {
    render(m.params?.structuredContent || JSON.parse(m.params?.content?.[0]?.text || "{}"));
  } else if (m.method === "ui/resource-teardown" && m.id != null) {
    window.parent.postMessage({ jsonrpc: "2.0", id: m.id, result: {} }, "*");
  }
});

/* saving a verdict: the host runs geri_bildirim (Kalkan on this computer, or the relay for ChatGPT; demo mode fakes it) */
async function save(resultId, v) {
  const args = { result_id: resultId, puan: v, atif_yapar: v === 2 };
  if (!embedded) { await new Promise(r => setTimeout(r, 700)); if (resultId.endsWith("-3") && !save.failed) { save.failed = 1; throw new Error("demo"); } return { saved: true }; }
  const r = await request("tools/call", { name: "geri_bildirim", arguments: args });
  if (r?.isError) throw new Error(r.content?.[0]?.text || "not saved");
  return r.structuredContent || {};
}

/* ---- rendering ---- */
function render(data) {
  const results = data.results || [];
  $("#sub").textContent = results.length ? `${results.length} karar · okuduklarınıza hüküm verin` : "";
  $("#foot").textContent = results.length
    ? (data.grades_note || "Hükümleriniz yalnızca bu bilgisayarda saklanır; Katip'i geliştirmek için ancak siz gönderirseniz kullanılır.")
    : (data.note || "Sonuç yok.");
  const list = $("#list"); list.innerHTML = "";
  results.forEach((r, i) => list.appendChild(block(r, i + 1)));
}

function block(r, rank) {
  const el = document.createElement("article");
  el.className = "block"; el.setAttribute("role", "listitem");
  const outcome = r.outcome ? `<span class="chip">${esc(r.outcome)}</span>` : "";
  const ga = r.general_assembly ? `<span class="chip">Genel Kurul</span>` : "";
  el.innerHTML = `
    <button class="row" aria-expanded="false">
      <span class="rank">${rank}</span>
      <span><div class="title">${esc(r.decision)}</div><div class="meta">${ga}${outcome}</div></span>
      <span class="ind"><span class="dot"></span><span class="ind-text">Hüküm ver</span><span class="chev"></span></span>
    </button>
    <div class="body">
      <div class="label">Katip'in bulduğu</div>
      <blockquote>${esc(r.quote)}</blockquote>
      <div class="why">Bulan sorgu: ${esc((r.found_by || []).join(", ") || "–")} · <a href="${esc(r.link)}" data-link>Kararın tamamı</a></div>
      <div class="judge" data-state="idle">
        <button class="gavel" aria-haspopup="true"><span class="g"></span><span class="gtext">Hüküm ver</span></button>
        <span class="verdicts" role="group" aria-label="Hükmünüz">
          ${VERDICTS.map(x => `<button class="v" data-v="${x.v}">${x.label}</button>`).join("")}
        </span>
        <span class="status" aria-live="polite"></span>
      </div>
    </div>`;
  $(".g", el).appendChild($("#gavel-svg").content.cloneNode(true));
  const row = $(".row", el), judge = $(".judge", el), status = $(".status", el), gtext = $(".gtext", el);
  row.onclick = () => { const open = el.classList.toggle("open"); row.setAttribute("aria-expanded", open); };
  $("[data-link]", el).onclick = e => { if (embedded) { e.preventDefault(); request("ui/open-link", { url: r.link }).catch(() => window.open(r.link, "_blank", "noopener")); } };
  $(".gavel", el).onclick = () => {
    if (judge.dataset.state === "striking") return;
    judge.dataset.state = judge.dataset.state === "open" ? (el.dataset.verdict ? "done" : "idle") : "open";
    status.textContent = judge.dataset.state === "open" ? "" : status.textContent;
    if (judge.dataset.state === "open") $(".v", el).focus();
  };
  el.querySelectorAll(".v").forEach(b => b.onclick = async () => {
    const v = Number(b.dataset.v), label = VERDICTS[v].label;
    judge.dataset.state = "striking"; gtext.textContent = "Kaydediliyor"; status.textContent = "";
    try {
      await Promise.all([save(r.result_id, v), new Promise(res => setTimeout(res, 450))]);
      judge.dataset.state = "done"; el.dataset.verdict = v;
      gtext.textContent = label; $(".ind-text", el).textContent = label;
      status.textContent = "Kaydedildi · değiştirmek için tokmağa basın";
    } catch (err) {
      judge.dataset.state = "error"; gtext.textContent = "Tekrar dene";
      status.textContent = "Kaydedilemedi. " + (embedded ? String(err.message).slice(0, 140) : "(örnek hata)");
    }
  });
  return el;
}

/* ---- size: tell the host our height so the iframe fits ---- */
new ResizeObserver(() => embedded && notify("ui/notifications/size-changed",
  { width: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight })).observe(document.body);

/* ---- start ---- */
if (embedded) {
  request("ui/initialize", { appCapabilities: {}, clientInfo: { name: "katip-emsal", version: "1" }, protocolVersion: "2026-01-26" })
    .then(() => notify("ui/notifications/initialized", {})).catch(() => {});
} else {
  document.title = "Örnek: Katip emsal sonuçları";
  $("#h").textContent = "Örnek veri · Katip'in bulduğu emsaller";
  render({ results: [
    { result_id: "demo-1", decision: "Ceza Genel Kurulu 2017/378 E., 2018/618 K.", general_assembly: true, outcome: "bozma",
      quote: "Ele geçirilen uyuşturucu maddenin miktarı, kişisel kullanım sınırları içinde kalması ve satışa yönelik delil bulunmaması karşısında eylem kullanmak için bulundurma suçunu oluşturur.",
      link: "https://mevzuat.adalet.gov.tr/ictihat/464064700", found_by: ["kişisel kullanım", "ticareti kullanmak"] },
    { result_id: "demo-2", decision: "Örnek Ceza Dairesi 2021/1 E., 2022/1 K.", general_assembly: false, outcome: "onama",
      quote: "Sanığın evinde yapılan aramada hassas terazi ve paketleme malzemesi ele geçirilmesi ticaret kastını gösterir.",
      link: "https://mevzuat.adalet.gov.tr/ictihat/1", found_by: ["kenevir kişisel kullanım"] },
    { result_id: "demo-3", decision: "Örnek Ceza Dairesi 2018/2 E., 2019/2 K.", general_assembly: false, outcome: "bozma",
      quote: "Kenevir yetiştirme eyleminin kişisel kullanım amacıyla yapıldığı savunması araştırılmadan hüküm kurulması.",
      link: "https://mevzuat.adalet.gov.tr/ictihat/2", found_by: ["kenevir"] },
  ] });
}
</script>
</body>
</html>
