name: Katip Kalkan release

on:
  push:
    tags: ["kalkan-v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: |
          pip install pytest cryptography onnxruntime numpy tokenizers pymupdf rapidocr
          cd connector && python -m pytest -q
      - name: Build bundle
        run: |
          python connector/build_bundle.py
          cd connector/dist && sha256sum katip-kalkan.mcpb > katip-kalkan.mcpb.sha256
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: connector/dist/katip-kalkan.mcpb
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" connector/dist/katip-kalkan.mcpb connector/dist/katip-kalkan.mcpb.sha256 \
            --title "Katip Kalkan ${GITHUB_REF_NAME#kalkan-v}" --prerelease \
            --notes-file connector/RELEASE_NOTES.md \
          || gh release upload "$GITHUB_REF_NAME" connector/dist/katip-kalkan.mcpb connector/dist/katip-kalkan.mcpb.sha256 --clobber
