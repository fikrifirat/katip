name: Katip Kalkan release

on:
  push:
    tags: ["kalkan-v*"]
    branches: [main]
    paths: ["connector/manifest.json"]  # a version bump merged to main publishes that version
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

# A tag push and the version-bump merge can arrive together; release one at a time, never cancel.
concurrency:
  group: kalkan-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.rel.outputs.publish == 'true' && github.event_name != 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v5
      - name: Which release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(python3 -c 'import json;print(json.load(open("connector/manifest.json"))["version"])')
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"; else tag="kalkan-v$ver-beta.1"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # A tag must name the version in manifest.json, or the bundle would ship under the wrong number.
          [[ "$tag" == "kalkan-v$ver" || "$tag" == kalkan-v"$ver"-* ]] || { echo "::error::$tag does not match manifest.json version $ver"; exit 1; }
          # Never rebuild over a published release: the MCP Registry and users pin its SHA-256.
          # To redo a release, delete it on GitHub first.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"; echo "::notice::$tag is already released, nothing to publish"; else echo "publish=true" >> "$GITHUB_OUTPUT"; fi
      - name: Engine in the plugin matches the app's
        run: cmp connector/katip_kalkan/engine.zip docs/katip_py.zip || { echo "Run python connector/build_bundle.py and commit engine.zip"; exit 1; }
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/kalkan-release.yml
      - name: Test
        run: |
          pip install pytest tokenizers onnxruntime==1.32.0 numpy==2.5.4 cryptography==50.0.2 pymupdf==2.1 rapidocr==3.10.0 playwright==1.65.2 katip-mask==0.1.1  # = launch.py
          cd connector && python -m pytest -q
      - name: Build bundle
        run: |
          python connector/build_bundle.py
          cd connector/dist && sha256sum katip-kalkan.mcpb > katip-kalkan.mcpb.sha256
      - name: Smoke test the bundle that will be published
        run: python connector/tests/smoke_mcpb.py connector/dist/katip-kalkan.mcpb
      - name: Attest build provenance
        if: steps.rel.outputs.publish == 'true' && github.event_name != 'workflow_dispatch'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: connector/dist/katip-kalkan.mcpb
      - name: Publish
        if: steps.rel.outputs.publish == 'true' && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.rel.outputs.tag }}"
          gh release create "$TAG" connector/dist/katip-kalkan.mcpb connector/dist/katip-kalkan.mcpb.sha256 \
            --target "$GITHUB_SHA" --title "Katip Kalkan ${TAG#kalkan-v}" --prerelease \
            --notes-file connector/RELEASE_NOTES.md

  registry:
    # List the new release in the official MCP Registry straight away (it was a manual step and fell behind).
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/mcp-registry.yml
