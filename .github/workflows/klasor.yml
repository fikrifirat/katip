name: Katip Klasör

on:
  pull_request:
    paths: ["desktop/**", "connector/katip_kalkan/**", ".github/workflows/klasor.yml"]
  push:
    branches: [main]
    paths: ["desktop/**", "connector/katip_kalkan/**", ".github/workflows/klasor.yml"]
    tags: ["klasor-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults: { run: { shell: bash } }
    env: { PYTHONUTF8: "1" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install the pinned dependencies (desktop/pyproject.toml)
        run: pip install pytest onnxruntime==1.32.0 numpy==2.5.4 cryptography==50.0.2 pymupdf==2.1 rapidocr==3.10.0 katip-mask==0.1.1
      - name: Tests (synthetic fixtures only)
        run: cd desktop && python -m pytest -q

  build:
    # unsigned betas: Mac users right-click > Open the first time, Windows users pass SmartScreen
    needs: test
    if: github.event_name != 'pull_request'
    name: build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults: { run: { shell: bash } }
    env: { PYTHONUTF8: "1" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: pip install pyinstaller==6.22.3 pywebview==6.2.1 onnxruntime==1.32.0 numpy==2.5.4 cryptography==50.0.2 pymupdf==2.1 rapidocr==3.10.0 katip-mask==0.1.1
      - name: Build
        run: cd desktop && pyinstaller packaging/katip-klasor.spec --noconfirm
      - name: Smoke test the built app (scan + status on a synthetic file, Turkish names)
        run: |
          mkdir -p "$RUNNER_TEMP/Katip/1 Gelen/Dava Ş"
          cp connector/tests/fixtures/dilekce_01.udf "$RUNNER_TEMP/Katip/1 Gelen/Dava Ş/"
          if [ "$RUNNER_OS" = "macOS" ]; then BIN="desktop/dist/Katip Klasör.app/Contents/MacOS/Katip Klasor"; else BIN="desktop/dist/Katip Klasor/Katip Klasor.exe"; fi
          export KATIP_HOME="$RUNNER_TEMP/home" KATIP_KLASOR_DIR="$RUNNER_TEMP/Katip" KATIP_MODEL_FIXED=1 KATIP_MODEL=nano KATIP_NO_KEYCHAIN=1
          "$BIN" scan
          "$BIN" status | tee status.txt
          grep -q "ready 1" status.txt
      - name: Package
        run: |
          cd desktop/dist
          if [ "$RUNNER_OS" = "macOS" ]; then
            hdiutil create -volname "Katip Klasör" -srcfolder "Katip Klasör.app" -ov -format UDZO ../katip-klasor-mac.dmg
          else
            7z a ../katip-klasor-windows.zip "Katip Klasor" > /dev/null
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: katip-klasor-${{ runner.os }}
          path: desktop/katip-klasor-*.*
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/klasor-v')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Pre-release with the Mac and Windows builds
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --prerelease --title "Katip Klasör ${GITHUB_REF_NAME#klasor-v}" --notes "Unsigned beta. Mac: right-click the app, Open. Windows: More info, Run anyway. See desktop/README.md."
