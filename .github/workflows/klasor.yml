name: Katip Klasör

on:
  pull_request:
    paths: ["desktop/**", "connector/katip_kalkan/**", ".github/workflows/klasor.yml"]
  push:
    branches: [main]
    paths: ["desktop/**", "connector/katip_kalkan/**", ".github/workflows/klasor.yml"]
  workflow_call:  # klasor-release.yml runs these jobs, then publishes their builds
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels that PR's older run; runs on main are never cancelled.
concurrency:
  group: klasor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Linux only: the Mac and Windows build jobs below run the same tests before building.
    name: Klasör tests (Linux)
    runs-on: ubuntu-latest
    env: { PYTHONUTF8: "1" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: .github/workflows/klasor.yml }
      - name: Install the pinned dependencies (desktop/pyproject.toml)
        run: pip install pytest onnxruntime==1.32.0 numpy==2.5.4 cryptography==50.0.2 pymupdf==2.1 rapidocr==3.10.0 katip-mask==0.1.1
      - name: Tests (synthetic fixtures only)
        run: cd desktop && python -m pytest -q

  build:
    # unsigned betas: Mac users right-click > Open the first time, Windows users pass SmartScreen.
    # Runs on pull requests too, so a reviewer can download the app from the run's artifacts.
    needs: test
    name: Klasör tests + app build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults: { run: { shell: bash } }
    env: { PYTHONUTF8: "1" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: .github/workflows/klasor.yml }
      - name: Install
        run: pip install pytest pyinstaller==6.22.3 pywebview==6.2.1 onnxruntime==1.32.0 numpy==2.5.4 cryptography==50.0.2 pymupdf==2.1 rapidocr==3.10.0 katip-mask==0.1.1
      - name: Tests (synthetic fixtures only)
        run: cd desktop && python -m pytest -q
      - name: Build
        run: cd desktop && pyinstaller packaging/katip-klasor.spec --noconfirm
      - name: Smoke test the built app (scan + status on a synthetic file, Turkish names)
        timeout-minutes: 10
        run: |
          mkdir -p "$RUNNER_TEMP/Katip/1 Gelen/Dava Ş"
          cp connector/tests/fixtures/dilekce_01.udf "$RUNNER_TEMP/Katip/1 Gelen/Dava Ş/"
          if [ "$RUNNER_OS" = "macOS" ]; then BIN="desktop/dist/Katip Klasör.app/Contents/MacOS/Katip Klasor"; else BIN="desktop/dist/Katip Klasor/Katip Klasor.exe"; fi
          export KATIP_HOME="$RUNNER_TEMP/home" KATIP_KLASOR_DIR="$RUNNER_TEMP/Katip" KATIP_MODEL_FIXED=1 KATIP_MODEL=nano KATIP_NO_KEYCHAIN=1
          "$BIN" scan
          "$BIN" status | tee status.txt
          grep -q "ready 1" status.txt
      - name: Package
        run: |
          cd desktop/dist
          if [ "$RUNNER_OS" = "macOS" ]; then
            hdiutil create -volname "Katip Klasör" -srcfolder "Katip Klasör.app" -ov -format UDZO ../katip-klasor-mac.dmg
          else
            7z a ../katip-klasor-windows.zip "Katip Klasor" > /dev/null
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: katip-klasor-${{ runner.os }}
          path: desktop/katip-klasor-*.*
          retention-days: 14


  menu-app:
    # Katip.app: the menu bar app with the engine and its own Python inside (desktop/macos, packaging/katip-engine.spec).
    needs: test
    name: Katip menu bar app (macOS)
    runs-on: macos-latest
    env: { PYTHONUTF8: "1" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: .github/workflows/klasor.yml }
      - name: Install
        run: |
          pip install pyinstaller==6.22.3 onnxruntime==1.32.0 numpy==2.5.4 cryptography==50.0.2 pymupdf==2.1 rapidocr==3.10.0 katip-mask==0.1.1
          brew install xcodegen
      - name: Build the engine
        run: cd desktop && pyinstaller packaging/katip-engine.spec --noconfirm
      - name: Build the app
        run: |
          cd desktop/macos && xcodegen generate
          xcodebuild -project KatipMenu.xcodeproj -scheme KatipMenu -configuration Release -derivedDataPath build CODE_SIGN_IDENTITY="-" build | tail -3
          codesign --verify --deep --strict build/Build/Products/Release/Katip.app
      - name: Self-test (installs its own launchd agent, masks and restores a synthetic sentence)
        timeout-minutes: 5
        env: { KATIP_NO_KEYCHAIN: "1" }
        run: |
          desktop/macos/build/Build/Products/Release/Katip.app/Contents/MacOS/Katip --selftest | tee selftest.json
          grep -q '"restored_matches":true' selftest.json
      - name: Package
        run: |
          cd desktop/macos/build/Build/Products/Release
          hdiutil create -volname "Katip" -srcfolder Katip.app -ov -format UDZO "$GITHUB_WORKSPACE/desktop/katip-mac.dmg"
      - uses: actions/upload-artifact@v5
        with: { name: katip-menu-app-macOS, path: desktop/katip-mac.dmg, retention-days: 14 }
