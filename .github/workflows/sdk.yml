name: SDKs (katip-mask)

on:
  pull_request:
    paths: ["sdk/**", "docs/katip_py.zip", ".github/workflows/sdk*.yml"]
  push:
    branches: [main]
    paths: ["sdk/**", "docs/katip_py.zip", ".github/workflows/sdk*.yml"]
  workflow_call:
    inputs:
      release:
        description: "Called by the release: skip the macOS/Windows job, whose runners can queue for a long time"
        type: boolean
        default: false
      ref:
        description: "Called by the release: the tag to test (a manual release run starts from a branch)"
        type: string
        default: ""
  workflow_dispatch:

env:
  # onnxruntime-node's install script downloads CUDA files from Microsoft's CDN, which can time out on
  # runners. The CPU build is bundled in the npm package and is all the tests use.
  ONNXRUNTIME_NODE_INSTALL: skip

permissions:
  contents: read

# A new push to a pull request cancels that PR's older run; runs on main and releases are never cancelled.
concurrency:
  group: sdk-${{ github.event.pull_request.number || github.ref }}-${{ inputs.release && 'release' || 'ci' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  in-step:
    name: Engine, tables, spec and versions in step
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ inputs.ref }}" }  # empty = the commit that started the run
      - uses: actions/setup-python@v6
        with: { python-version: "3.14" }
      - run: python sdk/tools/check.py --check

  python:
    # One job, one step per version: same coverage as a 5-way matrix, 1 check instead of 5.
    # 3.14 is current; 3.10 stays as the floor because Ubuntu 22.04 LTS (supported to 2027) ships it.
    name: Python 3.10 to 3.14
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ inputs.ref }}" }  # empty = the commit that started the run
      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
            3.14
      - name: Python 3.10
        run: python3.10 -m venv /tmp/v310 && /tmp/v310/bin/pip install -q -e "sdk/python[test]" && /tmp/v310/bin/pytest -q sdk/python/tests
      - name: Python 3.11
        if: ${{ !cancelled() }}
        run: python3.11 -m venv /tmp/v311 && /tmp/v311/bin/pip install -q -e "sdk/python[test]" && /tmp/v311/bin/pytest -q sdk/python/tests
      - name: Python 3.12
        if: ${{ !cancelled() }}
        run: python3.12 -m venv /tmp/v312 && /tmp/v312/bin/pip install -q -e "sdk/python[test]" && /tmp/v312/bin/pytest -q sdk/python/tests
      - name: Python 3.13
        if: ${{ !cancelled() }}
        run: python3.13 -m venv /tmp/v313 && /tmp/v313/bin/pip install -q -e "sdk/python[test]" && /tmp/v313/bin/pytest -q sdk/python/tests
      - name: Python 3.14
        if: ${{ !cancelled() }}
        run: python3.14 -m venv /tmp/v314 && /tmp/v314/bin/pip install -q -e "sdk/python[test]" && /tmp/v314/bin/pytest -q sdk/python/tests

  python-os:
    name: Python 3.14 on ${{ matrix.os }}
    if: ${{ !inputs.release }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macOS runners often queue for minutes (GitHub notes arm64 capacity limits), and Kalkan's
        # macOS job already runs katip-mask on a Mac for every connector PR. So pull requests test
        # Windows only; pushes to main (and manual runs) add macOS.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["windows-latest"]' || '["windows-latest", "macos-latest"]') }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ inputs.ref }}" }  # empty = the commit that started the run
      - uses: actions/setup-python@v6
        with: { python-version: "3.14" }
      - run: pip install -e "sdk/python[test]"
      - run: pytest -q sdk/python/tests

  js:
    # One job: golden cases are generated once, the package is built once, then tested on each Node.
    name: Node 22, 24, 26 (unit + parity with Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ inputs.ref }}" }  # empty = the commit that started the run
      - uses: actions/setup-python@v6
        with: { python-version: "3.14" }
      - name: Golden cases from the Python package
        run: python sdk/parity/golden.py --fuzz 1500 > sdk/parity/cases.jsonl
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: npm, cache-dependency-path: sdk/js/package-lock.json }  # maintenance LTS
      - name: Build, then test on Node 22
        working-directory: sdk/js
        run: npm ci && npm run build && npm test
      - uses: actions/setup-node@v5
        if: ${{ !cancelled() && hashFiles('sdk/js/dist/index.js') != '' }}  # tests still run on each Node if one fails
        with: { node-version: "24" }  # active LTS
      - name: Test on Node 24
        if: ${{ !cancelled() && hashFiles('sdk/js/dist/index.js') != '' }}  # tests still run on each Node if one fails
        working-directory: sdk/js
        run: node --version && npm test
      - uses: actions/setup-node@v5
        if: ${{ !cancelled() && hashFiles('sdk/js/dist/index.js') != '' }}  # tests still run on each Node if one fails
        with: { node-version: "26" }  # current
      - name: Test on Node 26
        if: ${{ !cancelled() && hashFiles('sdk/js/dist/index.js') != '' }}  # tests still run on each Node if one fails
        working-directory: sdk/js
        run: node --version && npm test

  models:
    name: Models in Python, Node and Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ inputs.ref }}" }  # empty = the commit that started the run
      - uses: actions/setup-python@v6
        with: { python-version: "3.14" }
      - uses: actions/setup-node@v5
        with: { node-version: "24", cache: npm, cache-dependency-path: sdk/js/package-lock.json }
      - uses: actions/cache@v5
        with:
          path: ~/.cache/katip-mask
          key: katip-mask-models-${{ hashFiles('sdk/spec/models.json') }}
      - run: pip install -e "sdk/python[model,test]"
      - name: Download and verify the pinned models
        run: for m in nano mini base; do katip-mask download $m; done
      - name: Python with models
        run: KATIP_MASK_TEST_MODELS=1 pytest -q sdk/python/tests
      - name: Node and Chromium with models
        working-directory: sdk/js
        env:
          KATIP_MASK_TEST_MODELS: "1"
          KATIP_MASK_BROWSER_MODEL: mini
        run: |
          npm ci
          npm run build
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          node --test test/api.test.mjs test/browser.test.mjs
