name: SDKs release (katip-mask)

# Push a tag sdk-vX.Y.Z (matching both package versions) to test, build and publish both packages.
# PyPI: trusted publishing (no token). npm: trusted publishing once configured, else the NPM_TOKEN secret.
# Without NPM_TOKEN the npm job is skipped with a warning; re-run that job after adding the secret.
# It can also be started by hand for an existing tag (Actions -> SDKs release -> Run workflow).
on:
  push:
    tags: ["sdk-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. sdk-v0.1.0"
        required: true

env:
  # onnxruntime-node's install script downloads CUDA files from Microsoft's CDN, which can time out on
  # runners. The CPU build is bundled in the npm package and is all the tests use.
  ONNXRUNTIME_NODE_INSTALL: skip

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/sdk.yml
    with: { release: true }

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.tag || github.ref }}" }  # build what the tag points at
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - name: Tag matches the package versions
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python sdk/tools/check.py --check
          tag="$TAG"
          [[ "$tag" =~ ^sdk-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad tag $tag"; exit 1; }
          want="${tag#sdk-v}"
          have=$(node -p "require('./sdk/js/package.json').version")
          [ "$want" = "$have" ] || { echo "tag $want but packages are $have"; exit 1; }
      - name: Build the Python package
        run: pip install build && python -m build sdk/python --outdir dist/python
      - name: Build the npm package
        working-directory: sdk/js
        run: mkdir -p ../../dist/npm && npm ci && npm run build && npm pack --pack-destination ../../dist/npm
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist }

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: pypi, url: https://pypi.org/project/katip-mask/ }
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: dist/python }

  npm:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: npm, url: https://www.npmjs.com/package/katip-mask }
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: actions/setup-node@v4
        with: { node-version: "24", registry-url: "https://registry.npmjs.org" }
      - name: Publish with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TRUSTED: ${{ vars.NPM_TRUSTED_PUBLISHING }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ] && [ "$NPM_TRUSTED" != "true" ]; then
            echo "::warning::NPM_TOKEN is not set, so npm was skipped. Add the secret and re-run this job."
            exit 0
          fi
          npx -y npm@11.6.2 publish dist/npm/katip-mask-*.tgz --provenance --access public

  github-release:
    needs: [pypi, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="$TAG"
          v="${tag#sdk-v}"
          gh release create "$tag" dist/python/* dist/npm/* --title "Katip Mask SDKs $v" --prerelease \
            --notes "pip install katip-mask==$v · npm install katip-mask@$v. Changes: sdk/CHANGELOG.md."
