[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "katip-mask"
version = "0.1.0"
description = "Detect and mask Turkish personal data (KVKK) locally, with optional ONNX name models."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Fikri Fırat" }]
keywords = ["kvkk", "pii", "redaction", "anonymization", "turkish", "privacy", "onnx"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Legal Industry",
  "Natural Language :: Turkish",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
dependencies = []  # rules run on the standard library alone

[project.optional-dependencies]
model = ["onnxruntime>=1.17", "numpy>=1.21"]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/fikrifirat/katip/tree/main/sdk"
Documentation = "https://github.com/fikrifirat/katip/tree/main/sdk/python#readme"
Source = "https://github.com/fikrifirat/katip"
Issues = "https://github.com/fikrifirat/katip/issues"
Changelog = "https://github.com/fikrifirat/katip/blob/main/sdk/CHANGELOG.md"
Demo = "https://fikrifirat.github.io/katip"

[project.scripts]
katip-mask = "katip_mask.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/katip_mask"]

[tool.hatch.build.targets.sdist]
include = ["src/katip_mask", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
